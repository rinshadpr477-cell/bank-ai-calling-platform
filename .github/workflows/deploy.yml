name: CI & Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bank-ai-calling/package-lock.json

      - name: Install Main App Dependencies
        working-directory: bank-ai-calling
        run: npm ci

      - name: Generate Prisma Client
        working-directory: bank-ai-calling
        run: npx prisma generate

      - name: Run Test Suite
        working-directory: bank-ai-calling
        run: npm test

      - name: Verify TypeScript
        working-directory: bank-ai-calling
        run: npx tsc --noEmit

      - name: Install Bridge Dependencies & Build
        working-directory: bank-ai-calling-bridge
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            echo "=== Reclaiming Disk Space on EC2 ==="
            docker builder prune -af || true
            docker image prune -af || true
            docker container prune -f || true
            sudo journalctl --vacuum-time=1d || true
            sudo rm -rf /tmp/* || true

            echo "=== Checking / Expanding Root Filesystem ==="
            sudo growpart /dev/xvda 1 || sudo growpart /dev/nvme0n1 1 || sudo growpart /dev/sda 1 || true
            sudo resize2fs /dev/xvda1 || sudo resize2fs /dev/nvme0n1p1 || sudo resize2fs /dev/sda1 || sudo xfs_growfs -d / || true
            df -h /

            echo "=== Pulling Latest Code ==="
            cd ~/bank-ai-calling-platform
            rm -f .git/objects/pack/tmp_pack_* || true
            git clean -f -d || true
            git reset --hard HEAD
            git pull origin main

            echo "=== Building and Starting Containers ==="
            docker compose up -d --build --remove-orphans

            echo "=== Post-Deploy Cleanup ==="
            docker builder prune -af || true
            df -h /