name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Run Tests, Types & Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bank-ai-calling/package-lock.json

      - name: Install Main App Dependencies
        working-directory: bank-ai-calling
        run: npm ci

      - name: Generate Prisma Client
        working-directory: bank-ai-calling
        run: npx prisma generate

      - name: Run Test Suite
        working-directory: bank-ai-calling
        run: npm test

      - name: Verify TypeScript (Main App)
        working-directory: bank-ai-calling
        run: npx tsc --noEmit

      - name: Install Bridge Dependencies & Build
        working-directory: bank-ai-calling-bridge
        run: |
          npm ci
          npm run build