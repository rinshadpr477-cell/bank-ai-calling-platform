name: CI & Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bank-ai-calling/package-lock.json

      - name: Install Main App Dependencies
        working-directory: bank-ai-calling
        run: npm ci

      - name: Generate Prisma Client
        working-directory: bank-ai-calling
        run: npx prisma generate

      - name: Run Test Suite
        working-directory: bank-ai-calling
        run: npm test

      - name: Verify TypeScript
        working-directory: bank-ai-calling
        run: npx tsc --noEmit

      - name: Install Bridge Dependencies & Build
        working-directory: bank-ai-calling-bridge
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd ~/bank-ai-calling-platform
            git pull origin main
            docker compose up -d --build --remove-orphans